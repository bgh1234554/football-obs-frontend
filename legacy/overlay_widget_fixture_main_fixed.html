<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OBS Football Dashboard</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- API-SPORTS Widgets -->
  <script type="module" crossorigin src="https://widgets.api-sports.io/3.1.0/widgets.js"></script>

  <style>
    :root{
      --bg:#111827;
      --panel:#0b1220;
      --line:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.55);
      --chip:rgba(255,255,255,.08);
    }

    /* ✅ 전체 페이지 스크롤 완전 제거 */
    html, body { height:100%; margin:0; overflow:hidden; }
    body{
      height:100vh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif;
    }

    /* 상단(스코어보드 + 탭바) */
    .scoreboard{
      background:#0f172a;
      border-bottom:1px solid var(--line);
      padding:14px 16px;
    }
    .scoreboard .title{
      font-size:26px;
      font-weight:800;
      text-align:center;
      line-height:1.2;
    }

    .tabs{
      display:flex;
      justify-content:space-between; /* 왼쪽 탭 그룹 + 오른쪽 버튼 */
      align-items:center;
      gap:10px;
      border-bottom:1px solid var(--line);
      padding:10px 12px;
      background:#0f172a;
    }
    .tab-group{ display:flex; gap:10px; align-items:center; }
    .tab{
      padding:10px 14px;
      border:1px solid var(--line);
      border-radius:12px;
      background:transparent;
      color:var(--text);
      cursor:pointer;
      font-weight:700;
    }
    .tab.active{
      background:rgba(255,255,255,.08);
      border-color:rgba(255,255,255,.22);
    }

    .right-btn{
      border:1px solid var(--line);
      background:transparent;
      color:var(--text);
      border-radius:12px;
      padding:10px 14px;
      font-weight:800;
      cursor:pointer;
      white-space:nowrap;
    }
    .right-btn:hover{ background:rgba(255,255,255,.06); }

    /* Pages: 남은 영역만 차지 */
    .pages{
      flex:1;
      min-height:0;
      overflow:hidden;
    }
    .page{
      display:none;
      height:100%;
      min-height:0;
      overflow:hidden;
    }
    .page.active{ display:block; }

    /* 공통 페이지 래퍼 */
    .page-wrap{
      display:flex;
      flex-direction:column;
      gap:12px;
      padding:12px;
      height:100%;
      min-height:0;
      overflow:hidden;
      box-sizing:border-box;
    }

    /* 일정 확인: 상단 fixtureBar + 그리드 */
    .fixtureBar{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:16px;
      padding:10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .fixtureText{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:baseline;
      font-weight:800;
    }
    .fixtureText .muted{ color:var(--muted); font-weight:800; }
    .fixtureText .id{
      font-weight:900;
      color:var(--text);
      padding:4px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.18);
    }

    .widgetGrid{
      flex:1;
      display:grid;
      grid-template-columns: 360px 1fr 420px;
      gap:12px;
      height:100%;
      min-height:0;
      overflow:hidden;
    }

    .panel{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
      min-height:0;
      display:flex;
      flex-direction:column;
    }

    .panelHeader{
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .panelHeader .hint{
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }

    /* ✅ 패널 내부만 스크롤 */
    .panelBody{
      flex:1;
      padding:0;
      overflow:auto;
      min-height:0;
    }

    /* ---------- Overlay (메인에서 fixtureId 입력) ---------- */
    .overlay-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      display:none;
      align-items:flex-start;
      justify-content:center;
      z-index:9999;
      padding:14px 12px;
    }
    .overlay-backdrop.open{ display:flex; }

    .overlay-card{
      width:min(1200px, calc(100vw - 24px));
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.55);
    }

    .overlay-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      font-weight:900;
    }
    .overlay-head .sub{ color:var(--muted); font-size:12px; font-weight:800; }
    .overlay-close{
      border:1px solid var(--line);
      background:transparent;
      color:var(--text);
      border-radius:12px;
      padding:6px 10px;
      font-weight:900;
      cursor:pointer;
    }

    .overlay-body{ padding:12px; }

    /* input-group이 너무 커 보일 때 살짝 다듬기 */
    .overlay-body .input-group .btn{ font-weight:800; }
  </style>
</head>

<body>
  <div class="scoreboard">
    <div class="title">홈팀 2 (3) - (1) 0 원정팀</div>
    <div style="text-align:center;color:var(--muted);font-weight:700;margin-top:6px;">
      (승부차기 있으면 여기다가 빨간색/초록색 표시)
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab-group">
      <button class="tab active" data-page="main">메인화면</button>
      <button class="tab" data-page="theme">테마</button>
      <button class="tab" data-page="schedule">일정 확인</button>
      <button class="tab" data-page="about">about</button>
    </div>

    <!-- ✅ 메인 화면에서 누르면 '빨간색으로 표시한 입력줄'이 overlay로 뜸 -->
    <button id="open-fixture-overlay" class="right-btn">경기ID 입력</button>
  </div>

  <div class="pages">
    <!-- MAIN -->
    <div id="page-main" class="page active">
      <div class="page-wrap">
        <div class="panel" style="min-height:340px;">
          <div class="panelHeader">
            <div>현재 메인에 표시 중</div>
            <div class="hint" id="main-current-label">-</div>
          </div>
          <div class="panelBody" id="main-game-host"></div>
        </div>
      </div>
    </div>

    <div id="page-theme" class="page">
      <div class="page-wrap">
        <div class="panel">
          <div class="panelHeader"><div>테마</div><div class="hint">나중에</div></div>
          <div class="panelBody" style="padding:12px;">테마(나중에)</div>
        </div>
      </div>
    </div>

    <!-- SCHEDULE (원래대로: 여기서는 overlay 버튼이 fixtureBar 토글하지 않음) -->
    <div id="page-schedule" class="page">
      <div class="page-wrap">

        <div class="fixtureBar">
          <div class="fixtureText">
            <span class="muted">선택된 경기 ID</span>
            <span id="selected-fixture-id" class="id">-</span>
            <span id="fixture-status" class="muted"></span>
          </div>

          <button id="copy-fixture-btn" class="btn btn-sm btn-outline-light" disabled>
            경기 id 복사하기
          </button>
        </div>

        <div class="widgetGrid">
          <div class="panel">
            <div class="panelHeader">
              <div>Leagues</div>
              <div class="hint">리그 선택 → 경기 목록 갱신</div>
            </div>
            <div class="panelBody">
              <api-sports-widget data-type="leagues"></api-sports-widget>
            </div>
          </div>

          <div class="panel">
            <div class="panelHeader">
              <div>Games</div>
              <div class="hint">경기 클릭 → 오른쪽 디테일 + ID 추출</div>
            </div>
            <div class="panelBody">
              <div id="games-list">
                <api-sports-widget data-type="games"></api-sports-widget>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="panelHeader">
              <div>Details</div>
              <div class="hint">선택에 따라 자동 표시</div>
            </div>
            <div class="panelBody">
              <div id="game-content"></div>
              <div style="border-top:1px solid var(--line);"></div>
              <div id="standings-content"></div>
              <div style="border-top:1px solid var(--line);"></div>
              <div id="team-content"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="page-about" class="page">
      <div class="page-wrap">
        <div class="panel">
          <div class="panelHeader"><div>about</div><div class="hint">나중에</div></div>
          <div class="panelBody" style="padding:12px;">about(나중에)</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ Config widget -->
  <api-sports-widget
    data-type="config"
    data-sport="football"
    data-key="75f25a92c3048b889fa8caa1d76ace91"
    data-lang="en"
    data-theme="grey"
    data-show-error="true"
    data-show-logos="true"
    data-refresh="20"
    data-favorite="true"
    data-standings="true"
    data-team-squad="true"
    data-team-statistics="true"
    data-player-statistics="true"
    data-tab="games"
    data-game-tab="statistics"
    data-target-league="#games-list"
    data-target-game="#game-content"
    data-target-standings="#standings-content"
    data-target-team="#team-content"
    data-target-player="modal"
  ></api-sports-widget>

  <!-- ✅ Overlay: 메인에서 fixtureId 입력 UI -->
  <div id="fixture-overlay" class="overlay-backdrop" aria-hidden="true">
    <div class="overlay-card" role="dialog" aria-modal="true" aria-label="경기ID 입력">
      <div class="overlay-head">
        <div>
          <div>메인 화면 - 경기 표시</div>
          <div class="sub">fixtureId 붙여넣고 '메인에 표시'를 누르면 메인에 뜸</div>
        </div>
        <button id="close-fixture-overlay" class="overlay-close">닫기</button>
      </div>

      <div class="overlay-body">
        <div class="input-group">
          <input id="main-fixture-input" class="form-control" placeholder="fixtureId (예: 1521155)" />
          <button id="main-show-btn" class="btn btn-primary">메인에 표시</button>
          <button id="main-use-last-btn" class="btn btn-outline-light">최근 선택값</button>
          <button id="main-clear-btn" class="btn btn-outline-secondary">비우기</button>
        </div>
        <div class="small text-secondary mt-2">
          • '최근 선택값'은 일정 확인 탭에서 마지막으로 클릭된 경기 ID를 불러와.
        </div>
      </div>
    </div>
  </div>

<script>
  // -----------------------------
  // Tabs
  // -----------------------------
  const tabButtons = document.querySelectorAll(".tab");
  function activatePage(page) {
    tabButtons.forEach(b => b.classList.toggle("active", b.dataset.page === page));
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    const el = document.getElementById(`page-${page}`);
    if (el) el.classList.add("active");
  }
  tabButtons.forEach(btn => {
    btn.addEventListener("click", () => activatePage(btn.dataset.page));
  });

  // -----------------------------
  // fixtureId extraction + copy (Schedule)
  // -----------------------------
  const selectedEl = document.getElementById("selected-fixture-id");
  const statusEl = document.getElementById("fixture-status");
  const copyBtn = document.getElementById("copy-fixture-btn");
  const gameTarget = document.querySelector("#game-content");

  let currentFixtureId = null;

  function setFixtureId(id) {
    currentFixtureId = id || null;
    if (selectedEl) selectedEl.textContent = currentFixtureId ?? "-";
    if (copyBtn) copyBtn.disabled = !currentFixtureId;
    if (currentFixtureId) localStorage.setItem("last_fixture_id", currentFixtureId);
  }
  function setStatus(msg) {
    if (!statusEl) return;
    statusEl.textContent = msg ? `(${msg})` : "";
  }
  function readFixtureIdFromTarget(targetEl) {
    const gameWidget = targetEl.querySelector('api-sports-widget[data-type="game"]');
    if (gameWidget) {
      const id = gameWidget.getAttribute("data-game-id");
      if (id) return id;
    }
    return null;
  }
  if (gameTarget) {
    const observer = new MutationObserver(() => {
      const id = readFixtureIdFromTarget(gameTarget);
      if (id && id !== currentFixtureId) {
        setFixtureId(id);
        setStatus("클릭으로 선택됨");
      }
    });
    observer.observe(gameTarget, { childList: true, subtree: true });
  }
  if (copyBtn) {
    copyBtn.addEventListener("click", async () => {
      if (!currentFixtureId) return;
      try {
        await navigator.clipboard.writeText(currentFixtureId);
        const prev = copyBtn.textContent;
        copyBtn.textContent = "복사됨!";
        setStatus("클립보드 복사 완료");
        setTimeout(() => {
          copyBtn.textContent = prev;
          setStatus("");
        }, 900);
      } catch {
        setStatus("복사 실패(브라우저 권한 확인)");
      }
    });
  }

  // -----------------------------
  // Main render (on demand)
  // -----------------------------
  const mainInput = document.getElementById("main-fixture-input");
  const mainShowBtn = document.getElementById("main-show-btn");
  const mainUseLastBtn = document.getElementById("main-use-last-btn");
  const mainClearBtn = document.getElementById("main-clear-btn");
  const mainHost = document.getElementById("main-game-host");
  const mainLabel = document.getElementById("main-current-label");

  function renderMainGame(fixtureId) {
    const id = (fixtureId || "").trim();
    if (!id) return;

    if (mainHost) mainHost.innerHTML = "";

    const w = document.createElement("api-sports-widget");
    w.setAttribute("data-type", "game");
    w.setAttribute("data-game-id", id);
    mainHost.appendChild(w);

    if (typeof w.connectedCallback === "function") w.connectedCallback();
    if (mainLabel) mainLabel.textContent = `fixtureId: ${id}`;
  }

  if (mainShowBtn) {
    mainShowBtn.addEventListener("click", () => {
      renderMainGame(mainInput?.value);
      closeOverlay();
    });
  }
  if (mainUseLastBtn) {
    mainUseLastBtn.addEventListener("click", () => {
      const last = localStorage.getItem("last_fixture_id");
      if (!last) return;
      if (mainInput) mainInput.value = last;
      if (mainInput) mainInput.focus();
    });
  }
  if (mainClearBtn) {
    mainClearBtn.addEventListener("click", () => {
      if (mainInput) mainInput.value = "";
      if (mainHost) mainHost.innerHTML = "";
      if (mainLabel) mainLabel.textContent = "-";
      if (mainInput) mainInput.focus();
    });
  }

  // -----------------------------
  // Overlay open/close
  // -----------------------------
  const overlay = document.getElementById("fixture-overlay");
  const openBtn = document.getElementById("open-fixture-overlay");
  const closeBtn = document.getElementById("close-fixture-overlay");

  function openOverlay() {
    // 메인 화면에서만 쓰는 UX지만, 어디서 눌러도 메인으로 보내주자
    activatePage("main");
    if (!overlay) return;
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    // focus
    setTimeout(() => mainInput?.focus(), 0);
  }
  function closeOverlay() {
    if (!overlay) return;
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
  }

  if (openBtn) openBtn.addEventListener("click", openOverlay);
  if (closeBtn) closeBtn.addEventListener("click", closeOverlay);

  // backdrop 클릭 닫기
  if (overlay) {
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) closeOverlay();
    });
  }
  // ESC 닫기
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && overlay?.classList.contains("open")) closeOverlay();
  });
</script>
</body>
</html>
